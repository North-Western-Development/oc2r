buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "commons-io:commons-io:2.21.0"
    }
}

plugins {
    id "idea"
    id "maven-publish"
    id 'net.neoforged.moddev' version '2.0.124'
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id "com.modrinth.minotaur" version "2.+"
}

import org.apache.commons.io.IOUtils

gradle.projectsEvaluated {
    project.configurations.named("jarJar") {
        def nativeLibsDir = file("src/main/resources/natives")
        // native networking library
        def nativeNetworkingBaseUrl = "https://github.com/${native_networking_repo}/releases/download/${network_lib_version}/"

        def targets = [
            "macos/liboc2rnet-x86_64.dylib",
            "macos/liboc2rnet-arm64.dylib",
            "windows/oc2rnet-x86_64.dll",
            "windows/oc2rnet-arm64.dll",
            "linux/liboc2rnet-linux-x86_64.so",
            "linux/liboc2rnet-linux-arm64.so",
            "android/liboc2rnet-android-arm64.so",
            "android/liboc2rnet-android-x86_64.so"
        ]

        def version_file = new File(nativeLibsDir, ".version")
        def old_version = version_file.isFile() ? version_file.withReader { it.readLine() } : ""
        def new_version = "${network_lib_version}"
        if (old_version != "${new_version}") {
            targets.each { path ->
                def file = new File(nativeLibsDir, path)
                file.parentFile.mkdirs()
                def fileName = path.tokenize('/')[-1]
                def url = new URL("${nativeNetworkingBaseUrl}${fileName}")
                println "Downloading ${url} → ${file}"
                file.withOutputStream { out ->
                    url.openStream().withCloseable { IOUtils.copy(it, out) }
                }
            }

            version_file.withWriter { it.writeLine(new_version) }
        }
    }
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.compilerArgs << "-Xmaxerrs" << "1000" << "-h" << ("${layout.buildDirectory.get().toString().replace("\\", "/")}/c" as String)
            }
        }
    }
}

static def getGitRef() {
    try {
        def command = "git rev-parse --short HEAD"
        def process = command.execute()
        return process.text.trim();
    } catch (final Throwable ignored) {
        return "unknown"
    }
}

version = System.getenv('RELEASE_TYPE') == "release" ? "${semver}" : "${semver}+${getGitRef()}"
group = "li.cil.oc2"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = "utf-8"
}

final def hasGithubPackageCredentials =
    (project.hasProperty("gpr.user") && project.hasProperty("gpr.key")) ||
        (System.getenv("GITHUB_ACTOR") && System.getenv("GITHUB_TOKEN"))

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven { url = "https://maven.covers1624.net/" }
    if (hasGithubPackageCredentials) {
        final def GithubPackages = [
            ["fnuecke/ceres", "li.cil.ceres"],
            ["North-Western-Development/sedna", "li.cil.sedna"],
            ["North-Western-Development/minux", "li.cil.sedna"]
        ]
        GithubPackages.each { final repo, final group ->
            maven {
                url = uri("https://maven.pkg.github.com/${repo}")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
                content { includeGroup group }
            }
        }
    }
    // Local Maven repository: when GitHub Packages credentials are not set,
    // scripts/download-libs.sh populates libs/ with a Maven-style layout
    // (e.g. libs/li/cil/ceres/ceres/0.0.4/ceres-0.0.4.jar). This lets the
    // jarJar dependencies below resolve transparently — no code changes
    // needed when switching between authenticated and unauthenticated builds.
    maven {
        name = "localLibs"
        url = uri("libs")
    }
    flatDir {
        dirs("libs")
    }

}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modId
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modId
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modId
        }

        data {
            data()
            programArguments.addAll '--mod', project.modId, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    // Specify the libs embedded in the library mod explicitly for local development, where
    // we can include these directly (and will have a local library mod using the local
    // versions). Can't get these to get properly resolved in the IDE otherwise (doesn't
    // pick them up via the library mod due to the embed configuration).
    implementation fileTree(dir: 'libs', include: '*.jar')

    // These three deps are hosted on GitHub Packages (when GITHUB_ACTOR /
    // GITHUB_TOKEN are set) OR on the local Maven repo at libs/ (populated
    // by scripts/download-libs.sh). Either way the coordinates are the same.
    jarJar(implementation('li.cil.ceres:ceres:0.0.4'))
    jarJar(implementation('li.cil.sedna:sedna:2.0.13'))
    jarJar(implementation('li.cil.sedna:sedna-buildroot:0.0.64'))
    // TODO: These additionalRuntimeClasspaths might be removable when we reach minecraft version 1.21.9
    //     They were necessary for using gradle runClient, gradle runServer, etc in prior versions
    additionalRuntimeClasspath 'li.cil.ceres:ceres:0.0.4'
    additionalRuntimeClasspath 'li.cil.sedna:sedna:2.0.13'
    additionalRuntimeClasspath 'li.cil.sedna:sedna-buildroot:0.0.64'

    implementation "curse.maven:architectury-api-${architectury_project_id}:${architectury_file_id}"
    // TODO: Change back to curse.maven dependency once markdown manual 1.21.1 is pushed to curseforge
    implementation "curse.maven:markdownmanual-${markdownmanual_project_id}:${markdownmanual_file_id}"
    //implementation "markdownmanual:markdown_manual-1.21.1-neoforge"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-${minecraft_sdk}-api:${jei_version}"

    runtimeOnly "mezz.jei:jei-${minecraft_version}-${minecraft_sdk}:${jei_version}"

    compileOnly "mrtjp:ProjectRed:${minecraft_version}-${pr_version}:api"
    runtimeOnly "io.codechicken:CodeChickenLib:${minecraft_version}-${ccl_version}"
    runtimeOnly "io.codechicken:CBMultipart:${minecraft_version}-${cbm_version}"
    runtimeOnly "mrtjp:ProjectRed:${minecraft_version}-${pr_version}:core"
    runtimeOnly "mrtjp:ProjectRed:${minecraft_version}-${pr_version}:transmission"

    if (debug_embeddium.toBoolean())
    {
        runtimeOnly "curse.maven:embeddium-${embeddium_project_id}:${embeddium_file_id}"
    }

    if (debug_embeddium_plus_plus.toBoolean())
    {
        runtimeOnly "curse.maven:embeddiumplus-${embeddium_plus_plus_project_id}:${embeddium_plus_plus_file_id}"
    }

    if (debug_oculus.toBoolean())
    {
        runtimeOnly "curse.maven:oculus-${oculus_project_id}:${oculus_file_id}"
    }

    testImplementation "org.mockito:mockito-inline:${mockito_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${jupiter_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jupiter_version}"
}

System.setProperty("line.separator", "\n")

tasks.register('packageScripts', Zip) {
    archiveFileName = "scripts.zip"
    destinationDirectory = file("${layout.buildDirectory.get()}/resources/main/data/oc2r/file_systems")
    from "src/main/scripts"
}

tasks.register('copyLicensesToResources', Copy) {
    from "."
    into file("${layout.buildDirectory.get()}/resources/main")
    include "LICENSE*"
}

processResources.dependsOn(packageScripts)
processResources.dependsOn(copyLicensesToResources)

tasks.named('jarJar'){
}

tasks.register('copyGeneratedResources', Copy) {
    from "src/generated"
    into "src/main"
    exclude "resources/.cache"
}

jar {
    manifest {
        attributes([
            "FMLAT"                   : "accesstransformer.cfg",
            "Specification-Title"     : "oc2r",
            "Specification-Vendor"    : "North Western Development (Originally by Sangar)",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${semver}",
            "Implementation-Vendor"   : "North Western Development (Originally by Sangar)",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "mixins.oc2r.json",
            "ContainedDeps"           : "commons-collections4-4.4.jar"
        ])
    }
}

tasks.register('apiJar', Jar) {
    archiveClassifier.set("api")
    from sourceSets.main.allSource
    from sourceSets.main.output
    include "li/cil/oc2/api/**"
}

publish {
    dependsOn(tasks.modrinth)
    dependsOn(tasks.curseforge)
}

artifacts {
    archives apiJar
}

static def getCurseforgeSDKValue(minecraft_sdk) {
    switch(minecraft_sdk) {
        case "forge": return "Forge"
        case "fabric": return "Fabric"
        case "neoforge": return "NeoForge"
        case "quilt": return "Quilt"
        default: throw new Exception("Unrecognized minecraft SDK")
    }
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_API_KEY") ?: ""

    project {
        id = curse_project_id
        releaseType = System.getenv('RELEASE_TYPE') ?: "alpha"
        changelogType = 'markdown'
        changelog = System.getenv("CHANGELOG") ?: "Changelog not available."
        addGameVersion getCurseforgeSDKValue(minecraft_sdk)
        addGameVersion minecraft_version
        addGameVersion "Java 17"
        mainArtifact "build/libs/oc2r-${minecraft_version}-${minecraft_sdk}-${version}.jar"
        relations {
            requiredDependency "markdown-manual-reimagined"
            requiredDependency "packet-fixer"
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = modrinth_project_id
    versionType = System.getenv('RELEASE_TYPE') ?: "alpha"
    uploadFile = "build/libs/oc2r-${minecraft_version}-${minecraft_sdk}-${version}.jar"
    gameVersions = [minecraft_version]
    loaders = [minecraft_sdk]
    changelog = System.getenv("CHANGELOG") ?: "Changelog not available."
    dependencies {
        required.project "markdown-manual-reimagined"
        required.project "packet-fixer"
    }
}

idea {
    module {
        for (final String exclude in ["assets", "run", "out", "logs", "src/generated"]) {
            excludeDirs += file(exclude)
        }
    }
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

test {
    useJUnitPlatform()
}

